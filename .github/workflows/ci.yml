name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        # Not `npm ci`: this repo has hit repeated cross-platform optional-
        # dependency lockfile skew (a documented npm limitation with
        # platform-variant native binaries such as @rolldown/binding-* and
        # their nested @emnapi/* pins) -- a lockfile regenerated on one OS
        # doesn't always record every other OS's optional-dependency
        # resolution, so `npm ci` on this Linux runner rejects a lockfile
        # that's perfectly valid and installs cleanly via `npm install`
        # (this runner's own build pipeline included). `npm install` is
        # less strict than `npm ci` (it can adjust the lockfile rather than
        # failing outright), which is exactly the tolerance needed here.
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://stonza.pk
          NEXT_PUBLIC_ADMIN_URL: https://stonza.pk/admin

      - name: Audit dependencies (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
